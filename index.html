<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Sphere with Boundary</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        button {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // White background

        // Camera setup
        const camera = new THREE.PerspectiveCamera(
            75, // Field of view
            window.innerWidth / window.innerHeight, // Aspect ratio
            0.1, // Near clipping
            1000 // Far clipping
        );
        camera.position.z = 10; // Position to view boundary and sphere
        camera.lookAt(0, 0, 0);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Define boundary radius
        const boundaryRadius = 5;

        // Add boundary sphere (wireframe)
        const boundaryGeometry = new THREE.SphereGeometry(boundaryRadius, 32, 32);
        const boundaryMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x000000, 
            wireframe: true 
        });
        const boundarySphere = new THREE.Mesh(boundaryGeometry, boundaryMaterial);
        scene.add(boundarySphere);

        // Expanding sphere
        const geometry = new THREE.SphereGeometry(1, 32, 32); // Initial radius 1
        const material = new THREE.MeshPhongMaterial({ 
            color: 0x00ff00, // Green
            shininess: 100   // Shiny
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(1, 1, 1).normalize();
        scene.add(directionalLight);

        // Animation variables
        let scale = 0.1; // Initial scale (effective radius = 0.1)
        const clock = new THREE.Clock();

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Update only if scale is less than boundaryRadius
            if (scale < boundaryRadius) {
                scale += 0.5 * delta; // Increase scale over time
                if (scale > boundaryRadius) {
                    scale = boundaryRadius; // Clamp to boundary
                }
                sphere.scale.set(scale, scale, scale);
                sphere.rotation.y += 1 * delta; // Rotate
            }

            renderer.render(scene, camera);
        }
        animate();

        // Reset button
        const button = document.createElement('button');
        button.textContent = 'Reset';
        document.body.appendChild(button);
        button.addEventListener('click', () => {
            scale = 0.1;          // Reset scale
            sphere.rotation.y = 0; // Reset rotation
        });
    </script>
</body>
</html>
