<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Spheres with Overlap Clipping</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #percentage {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
            color: black;
            font-size: 16px;
        }
        button {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <div id="percentage">0%</div>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const boundaryRadius = 5;
        const boundary = new THREE.Mesh(
            new THREE.SphereGeometry(boundaryRadius, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true })
        );
        scene.add(boundary);

        // Function to create a sphere with custom shader for clipping
        function createSphere(color) {
            const material = new THREE.MeshPhongMaterial({ color, shininess: 100 });
            material.onBeforeCompile = (shader) => {
                // Define uniforms for boundary and other sphere's position/radius
                shader.uniforms.boundaryRadius = { value: boundaryRadius };
                shader.uniforms.otherCenter = { value: new THREE.Vector3() };
                shader.uniforms.otherRadius = { value: 0 };

                // Modify vertex shader to pass world position
                shader.vertexShader = 'varying vec3 vWorldPosition;\n' + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace(
                    'void main() {',
                    'void main() {\n    vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;'
                );

                // Modify fragment shader to clip against boundary and other sphere
                shader.fragmentShader = 'uniform float boundaryRadius;\nuniform vec3 otherCenter;\nuniform float otherRadius;\nvarying vec3 vWorldPosition;\n' + shader.fragmentShader;
                shader.fragmentShader = shader.fragmentShader.replace(
                    'void main() {',
                    'void main() {\n' +
                    '    float distToCenter = length(vWorldPosition);\n' +
                    '    if (distToCenter > boundaryRadius) discard;\n' +
                    '    float distToOther = length(vWorldPosition - otherCenter);\n' +
                    '    if (distToOther < otherRadius) discard;\n'
                );
            };
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), material);
            scene.add(sphere);
            return sphere;
        }

        // Create two spheres
        const sphereA = createSphere(0x00ff00); // Green
        const sphereB = createSphere(0x0000ff); // Blue

        // Add lighting
        scene.add(new THREE.AmbientLight(0x404040));
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1).normalize();
        scene.add(light);

        // Grid setup for occupancy check
        const gridResolution = 20;
        const gridSpacing = boundaryRadius * 2 / gridResolution;
        const gridPoints = [];
        for (let x = -boundaryRadius; x <= boundaryRadius; x += gridSpacing) {
            for (let y = -boundaryRadius; y <= boundaryRadius; y += gridSpacing) {
                for (let z = -boundaryRadius; z <= boundaryRadius; z += gridSpacing) {
                    if (x * x + y * y + z * z <= boundaryRadius * boundaryRadius) {
                        gridPoints.push(new THREE.Vector3(x, y, z));
                    }
                }
            }
        }
        const totalGridPoints = gridPoints.length;

        // Function to get random point inside boundary sphere
        function getRandomPointInSphere(radius) {
            let x, y, z, d;
            do {
                x = (Math.random() - 0.5) * 2 * radius;
                y = (Math.random() - 0.5) * 2 * radius;
                z = (Math.random() - 0.5) * 2 * radius;
                d = x * x + y * y + z * z;
            } while (d > radius * radius);
            return { x, y, z };
        }

        // Set initial positions
        const posA = getRandomPointInSphere(boundaryRadius);
        sphereA.position.set(posA.x, posA.y, posA.z);
        const posB = getRandomPointInSphere(boundaryRadius);
        sphereB.position.set(posB.x, posB.y, posB.z);

        // Animation variables
        let scaleA = 0.1;
        let scaleB = 0.1;
        const clock = new THREE.Clock();
        let simulationRunning = true;

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (simulationRunning) {
                // Expand spheres
                if (scaleA < boundaryRadius) {
                    scaleA += 0.5 * delta;
                    if (scaleA > boundaryRadius) scaleA = boundaryRadius;
                    sphereA.scale.set(scaleA, scaleA, scaleA);
                    sphereA.rotation.y += 1 * delta;
                }
                if (scaleB < boundaryRadius) {
                    scaleB += 0.5 * delta;
                    if (scaleB > boundaryRadius) scaleB = boundaryRadius;
                    sphereB.scale.set(scaleB, scaleB, scaleB);
                    sphereB.rotation.y += 1 * delta;
                }

                // Update shader uniforms for overlap clipping
                sphereA.material.uniforms.otherCenter.value.copy(sphereB.position);
                sphereA.material.uniforms.otherRadius.value = scaleB;
                sphereB.material.uniforms.otherCenter.value.copy(sphereA.position);
                sphereB.material.uniforms.otherRadius.value = scaleA;

                // Calculate occupancy percentage
                let occupiedPoints = 0;
                gridPoints.forEach(point => {
                    const distA = point.distanceTo(sphereA.position);
                    const distB = point.distanceTo(sphereB.position);
                    if (distA < scaleA || distB < scaleB) {
                        occupiedPoints++;
                    }
                });
                const percentage = (occupiedPoints / totalGridPoints) * 100;
                document.getElementById('percentage').textContent = percentage.toFixed(2) + '%';

                // Stop simulation when space is full
                if (percentage >= 99.9) {
                    simulationRunning = false;
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        // Reset button
        const resetButton = document.createElement('button');
        resetButton.textContent = 'Reset';
        document.body.appendChild(resetButton);
        resetButton.addEventListener('click', () => {
            const posA = getRandomPointInSphere(boundaryRadius);
            sphereA.position.set(posA.x, posA.y, posA.z);
            const posB = getRandomPointInSphere(boundaryRadius);
            sphereB.position.set(posB.x, posB.y, posB.z);
            scaleA = 0.1;
            scaleB = 0.1;
            sphereA.rotation.y = 0;
            sphereB.rotation.y = 0;
            simulationRunning = true;
        });
    </script>
</body>
</html>
