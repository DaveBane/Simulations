<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Expanding Spheres with Boundary Clipping</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        button {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Create the scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // White background

        // Create the camera
        const camera = new THREE.PerspectiveCamera(
            75, // Field of view
            window.innerWidth / window.innerHeight, // Aspect ratio
            0.1, // Near clipping plane
            1000 // Far clipping plane
        );
        camera.position.z = 15;
        camera.lookAt(0, 0, 0);

        // Create the renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Define boundary radius
        const boundaryRadius = 5;

        // Add boundary sphere (wireframe)
        const boundaryGeometry = new THREE.SphereGeometry(boundaryRadius, 32, 32);
        const boundaryMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true });
        const boundarySphere = new THREE.Mesh(boundaryGeometry, boundaryMaterial);
        scene.add(boundarySphere);

        // Function to create material with clipping shader
        function createClippingMaterial(color) {
            const material = new THREE.MeshPhongMaterial({ color: color, shininess: 100 });
            material.onBeforeCompile = function(shader) {
                shader.uniforms.boundaryRadius = { value: boundaryRadius };
                shader.vertexShader = 'varying vec3 vWorldPosition;\n' + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace(
                    'void main() {',
                    'void main() {\n    vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;'
                );
                shader.fragmentShader = 'uniform float boundaryRadius;\nvarying vec3 vWorldPosition;\n' + shader.fragmentShader;
                shader.fragmentShader = shader.fragmentShader.replace(
                    'void main() {',
                    'void main() {\n    float distanceToCenter = length(vWorldPosition);\n    if (distanceToCenter > boundaryRadius) {\n        discard;\n    }'
                );
            };
            return material;
        }

        // Create geometry for spheres
        const geometry = new THREE.SphereGeometry(1, 32, 32);

        // Arrays to manage spheres and their scales
        const spheres = [];
        const scales = [];
        const colors = [0x00ff00, 0x0000ff]; // Green and Blue

        // Create two spheres
        colors.forEach(color => {
            const material = createClippingMaterial(color);
            const sphere = new THREE.Mesh(geometry, material);
            const pos = getRandomPointInSphere(boundaryRadius);
            sphere.position.set(pos.x, pos.y, pos.z);
            scene.add(sphere);
            spheres.push(sphere);
            scales.push(0.1); // Initial scale
        });

        // Add lighting
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(1, 1, 1).normalize();
        scene.add(directionalLight);

        // Function to get a random point inside the boundary sphere
        function getRandomPointInSphere(radius) {
            let x, y, z, d;
            do {
                x = (Math.random() - 0.5) * 2 * radius;
                y = (Math.random() - 0.5) * 2 * radius;
                z = (Math.random() - 0.5) * 2 * radius;
                d = Math.sqrt(x * x + y * y + z * z);
            } while (d > radius);
            return { x, y, z };
        }

        // Animation setup
        const clock = new THREE.Clock();

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            spheres.forEach((sphere, index) => {
                if (scales[index] < boundaryRadius) {
                    scales[index] += 0.5 * delta;
                    if (scales[index] > boundaryRadius) scales[index] = boundaryRadius;
                    sphere.scale.set(scales[index], scales[index], scales[index]);
                    sphere.rotation.y += 1 * delta;
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        // Add reset button
        const button = document.createElement('button');
        button.textContent = 'Reset';
        document.body.appendChild(button);

        button.addEventListener('click', () => {
            spheres.forEach((sphere, index) => {
                const pos = getRandomPointInSphere(boundaryRadius);
                sphere.position.set(pos.x, pos.y, pos.z);
                scales[index] = 0.1;
                sphere.rotation.y = 0;
            });
        });
    </script>
</body>
</html>
