​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Sphere</title>
</head>
<body>
    <!-- Load Three.js from a reliable CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Create the scene
        const scene = new THREE.Scene();

        // Set up the camera with a clear view
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5); // Positioned 5 units away to see the sphere

        // Initialize the renderer with a light background
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0xf0f0f0); // Light gray background for contrast
        document.body.appendChild(renderer.domElement); // Add renderer to the page

        // Create a visible sphere
        const geometry = new THREE.SphereGeometry(1, 32, 32); // 1-unit radius, smooth
        const material = new THREE.MeshPhongMaterial({ color: 0xff0000, shininess: 100 }); // Red and shiny
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere); // Add sphere to the scene

        // Add lighting so the sphere is visible
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5); // Soft ambient light
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1); // Bright directional light
        directionalLight.position.set(5, 10, 7.5); // Positioned to illuminate the sphere
        scene.add(directionalLight);

        // Animation variables for expansion and rotation
        let scale = 0.5; // Start with a visible size
        const speed = 0.2; // Slow expansion rate
        let lastTime = 0;

        // Animation loop
        function animate(time) {
            requestAnimationFrame(animate); // Keep the loop running
            if (!lastTime) lastTime = time;
            const delta = (time - lastTime) / 1000; // Time difference in seconds
            lastTime = time;

            // Expand and rotate the sphere
            scale += delta * speed;
            sphere.scale.set(scale, scale, scale);
            sphere.rotation.y += delta * 0.5; // Slow rotation for effect
            renderer.render(scene, camera); // Render the scene
        }

        // Adjust for window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start the animation
        animate();
    </script>
</body>
</html>
