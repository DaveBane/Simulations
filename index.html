<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaded Expanding Sphere</title>
</head>
<body>
    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Create the scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // White background for contrast

        // Create the camera
        const camera = new THREE.PerspectiveCamera(
            75, // Field of view
            window.innerWidth / window.innerHeight, // Aspect ratio
            0.1, // Near clipping plane
            1000 // Far clipping plane
        );
        camera.position.z = 5; // Position camera to view the sphere
        camera.lookAt(0, 0, 0); // Ensure camera points at the sphere

        // Create the renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Create the sphere with a material that supports shading
        const geometry = new THREE.SphereGeometry(1, 32, 32); // Radius 1, 32 segments
        const material = new THREE.MeshPhongMaterial({
            color: 0x00ff00, // Green color
            shininess: 100 // Shiny surface for visible highlights
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Add lights for shading
        const ambientLight = new THREE.AmbientLight(0x404040); // Soft overall light
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1); // White light, full intensity
        directionalLight.position.set(1, 1, 1).normalize(); // Light direction from top-right-front
        scene.add(directionalLight);

        // Animation variables
        let scale = 0.1; // Initial scale of the sphere
        const clock = new THREE.Clock(); // For consistent timing

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta(); // Time since last frame

            // Expand the sphere
            scale += 0.5 * delta; // Increase scale at 0.5 units per second
            sphere.scale.set(scale, scale, scale);

            // Rotate the sphere
            sphere.rotation.y += 1 * delta; // Rotate at 1 radian per second

            // Render the scene
            renderer.render(scene, camera);
        }

        // Start the animation
        animate();
    </script>
</body>
</html>
