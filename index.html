<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Spheres with Overlap Clipping</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #percentage {
            position: absolute;
            top: 10px;
            left: 10px;
            color: black;
            font-size: 16px;
        }
        button {
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <div id="percentage">0%</div>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const boundaryRadius = 5;
        const boundary = new THREE.Mesh(
            new THREE.SphereGeometry(boundaryRadius, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true })
        );
        scene.add(boundary);

        // Sphere creation with boundary and overlap clipping
        function createSphere(color) {
            const material = new THREE.MeshPhongMaterial({ color, shininess: 100 });
            material.onBeforeCompile = (shader) => {
                // Define uniforms for boundary and other sphere
                shader.uniforms.boundaryRadius = { value: boundaryRadius };
                shader.uniforms.otherCenter = { value: new THREE.Vector3() };
                shader.uniforms.otherRadius = { value: 0 };

                // Vertex shader: Pass world position to fragment shader
                shader.vertexShader = 'varying vec3 vWorldPosition;\n' + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace(
                    'void main() {',
                    'void main() {\n    vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;\n'
                );

                // Fragment shader: Clip at boundary and discard overlap
                shader.fragmentShader = 'uniform float boundaryRadius;\nuniform vec3 otherCenter;\nuniform float otherRadius;\nvarying vec3 vWorldPosition;\n' + shader.fragmentShader;
                shader.fragmentShader = shader.fragmentShader.replace(
                    'void main() {',
                    'void main() {\n    float dist = length(vWorldPosition);\n    if (dist > boundaryRadius) discard;\n    float distToOther = length(vWorldPosition - otherCenter);\n    if (distToOther < otherRadius) discard;\n'
                );
            };
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), material);
            scene.add(sphere);
            return sphere;
        }

        const spheres = [createSphere(0x00ff00), createSphere(0x0000ff)];
        const scales = [0.1, 0.1];

        // Lighting
        scene.add(new THREE.AmbientLight(0x404040));
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1).normalize();
        scene.add(light);

        // Grid setup
        const gridResolution = 20;
        const gridSpacing = boundaryRadius * 2 / gridResolution;
        const gridPoints = [];
        for (let x = -boundaryRadius; x <= boundaryRadius; x += gridSpacing) {
            for (let y = -boundaryRadius; y <= boundaryRadius; y += gridSpacing) {
                for (let z = -boundaryRadius; z <= boundaryRadius; z += gridSpacing) {
                    if (x * x + y * z + z * z <= boundaryRadius * boundaryRadius) {
                        gridPoints.push(new THREE.Vector3(x, y, z));
                    }
                }
            }
        }
        const totalGridPoints = gridPoints.length;

        // Random position in sphere
        function getRandomPointInSphere(radius) {
            let x, y, z, d;
            do {
                x = (Math.random() - 0.5) * 2 * radius;
                y = (Math.random() - 0.5) * 2 * radius;
                z = (Math.random() - 0.5) * 2 * radius;
                d = x * x + y * y + z * z;
            } while (d > radius * radius);
            return { x, y, z };
        }

        // Set initial positions
        spheres.forEach(sphere => {
            const pos = getRandomPointInSphere(boundaryRadius);
            sphere.position.set(pos.x, pos.y, pos.z);
        });

        // Animation
        const clock = new THREE.Clock();
        let simulationRunning = true;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (simulationRunning) {
                // Expand and rotate spheres
                spheres.forEach((sphere, i) => {
                    scales[i] += 0.5 * delta;
                    sphere.scale.set(scales[i], scales[i], scales[i]);
                    sphere.rotation.y += 1 * delta;
                });

                // Update shader uniforms for overlap clipping
                spheres[0].material.uniforms.otherCenter.value.copy(spheres[1].position);
                spheres[0].material.uniforms.otherRadius.value = scales[1];
                spheres[1].material.uniforms.otherCenter.value.copy(spheres[0].position);
                spheres[1].material.uniforms.otherRadius.value = scales[0];

                // Calculate occupancy
                let occupiedPoints = 0;
                gridPoints.forEach(point => {
                    for (let sphere of spheres) {
                        const dist = point.distanceTo(sphere.position);
                        if (dist < scales[spheres.indexOf(sphere)]) {
                            occupiedPoints++;
                            break; // Point is occupied, no need to check other spheres
                        }
                    }
                });
                const percentage = (occupiedPoints / totalGridPoints) * 100;
                document.getElementById('percentage').textContent = percentage.toFixed(2) + '%';

                // Stop when space is full
                if (percentage >= 99.9) {
                    simulationRunning = false;
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        // Reset button
        const resetButton = document.createElement('button');
        resetButton.textContent = 'Reset';
        document.body.appendChild(resetButton);
        resetButton.addEventListener('click', () => {
            spheres.forEach(sphere => {
                const pos = getRandomPointInSphere(boundaryRadius);
                sphere.position.set(pos.x, pos.y, pos.z);
                sphere.rotation.y = 0;
            });
            scales.fill(0.1);
            simulationRunning = true;
        });
    </script>
</body>
</html>
