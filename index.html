<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Sphere with Percentage Counter</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #percentage {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
            color: black;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <div id="percentage">0%</div>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        // Renderer setup
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Boundary sphere (wireframe)
        const boundaryRadius = 5;
        const boundary = new THREE.Mesh(
            new THREE.SphereGeometry(boundaryRadius, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true })
        );
        scene.add(boundary);

        // Expanding sphere
        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(1, 32, 32),
            new THREE.MeshPhongMaterial({ color: 0x00ff00 })
        );
        scene.add(sphere);

        // Lighting
        scene.add(new THREE.AmbientLight(0x404040));
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1).normalize();
        scene.add(light);

        // Animation variables
        let scale = 0.1;
        const clock = new THREE.Clock();

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (scale < boundaryRadius) {
                scale += 0.5 * delta;
                if (scale > boundaryRadius) scale = boundaryRadius;
                sphere.scale.set(scale, scale, scale);
            }

            // Update percentage counter
            const percentage = (Math.pow(scale, 3) / Math.pow(boundaryRadius, 3)) * 100;
            document.getElementById('percentage').textContent = percentage.toFixed(2) + '%';

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
