<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Sphere</title>
    <style>
        body { margin: 0; }
        #container { width: 100vw; height: 100vh; background-color: #f0f0f0; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Get the container
        const container = document.getElementById('container');

        // Create the scene with a light background
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xcccccc); // Light gray background

        // Set up the camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5); // Positioned to see the sphere
        camera.lookAt(0, 0, 0); // Look at the center where the sphere is

        // Create the renderer and append it to the container
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Create a red, shiny sphere
        const geometry = new THREE.SphereGeometry(1, 32, 32); // Radius of 1 unit
        const material = new THREE.MeshPhongMaterial({ color: 0xff0000, shininess: 100 });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Add lights to illuminate the sphere
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); // Soft ambient light
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1); // Bright point light
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // Animation variables
        let scale = 1; // Start with a visible size
        const speed = 0.5; // Scale units per second
        let lastTime = 0;

        // Animation loop
        function animate(time) {
            requestAnimationFrame(animate);
            if (!lastTime) lastTime = time;
            const delta = (time - lastTime) / 1000; // Time in seconds
            lastTime = time;

            // Expand and rotate the sphere
            scale += speed * delta;
            sphere.scale.set(scale, scale, scale);
            sphere.rotation.y += 0.5 * delta; // Rotate at 0.5 radian per second
            renderer.render(scene, camera);
        }

        // Start the animation
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
