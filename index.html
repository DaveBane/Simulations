<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaded Expanding Sphere with Reset</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        button {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Create the scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // White background

        // Create the camera
        const camera = new THREE.PerspectiveCamera(
            75, // Field of view
            window.innerWidth / window.innerHeight, // Aspect ratio
            0.1, // Near clipping plane
            1000 // Far clipping plane
        );
        camera.position.z = 5; // Position camera
        camera.lookAt(0, 0, 0);

        // Create the renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Create the sphere with a shaded material
        const geometry = new THREE.SphereGeometry(1, 32, 32);
        const material = new THREE.MeshPhongMaterial({
            color: 0x00ff00, // Green
            shininess: 100   // Shiny surface
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Add lights for shading
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(1, 1, 1).normalize();
        scene.add(directionalLight);

        // Animation variables
        let scale = 0.1; // Initial scale
        const clock = new THREE.Clock();

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Expand and rotate the sphere
            scale += 0.5 * delta;
            sphere.scale.set(scale, scale, scale);
            sphere.rotation.y += 1 * delta;

            renderer.render(scene, camera);
        }
        animate();

        // Add reset button
        const button = document.createElement('button');
        button.textContent = 'Reset';
        document.body.appendChild(button);
        button.addEventListener('click', () => {
            scale = 0.1;          // Reset scale
            sphere.rotation.y = 0; // Reset rotation
        });
    </script>
</body>
</html>
