<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Sphere</title>
</head>
<body>
    <!-- Load Three.js from a reliable CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Create the scene
        const scene = new THREE.Scene();
        
        // Create the camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5; // Position the camera 5 units away from the sphere

        // Create the renderer and add it to the page
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Create a green sphere with a basic material (no lights needed)
        const geometry = new THREE.SphereGeometry(1, 32, 32); // Radius of 1 unit
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 }); // Green color
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere); // Add the sphere to the scene

        // Animation variables
        let scale = 0.1; // Start with a small scale

        // Animation loop to expand the sphere
        function animate() {
            requestAnimationFrame(animate); // Keep the animation running
            scale += 0.01; // Increase scale over time
            sphere.scale.set(scale, scale, scale); // Apply the new scale
            renderer.render(scene, camera); // Render the scene
        }

        // Start the animation
        animate();
    </script>
</body>
</html>
